apiVersion: 1

datasources:
  - name: 'guilhermearpassos-sqlsights-datasource'
    type: 'guilhermearpassos-sqlsights-datasource'
    access: proxy
    isDefault: false
    orgId: 1
    version: 1
    editable: true
    jsonData:
      path: '/resources'
    secureJsonData:
      apiKey: 'api-key'

  - name: 'Tempo'
    uid: 'tempo'
    type: 'tempo'
    access: proxy
    url: 'http://tempo:3200'
    isDefault: false
    orgId: 1
    version: 1
    editable: true
    jsonData:
      httpMethod: GET
