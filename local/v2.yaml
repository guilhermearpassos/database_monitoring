infra:
  telemetry:
    enabled: true
    service_name: sqlsights
    otlp:
      enabled: true
      endpoint: localhost:4317
    metrics:
      enabled: true
      host: localhost:9016
runtimes:
  grpc_server:
    enabled: true
    grpc:
      url: localhost:9014
      grpc_message_max_size: 100000000
  grpc_ui:
    enabled: true
    url: localhost:9015
services:
  agent:
    enabled: true
    targets:
      - alias: "localhost"
        driver: mssql
        conn_string: "server=localhost;port=1433;user id=sa;password=SqlServer2019!"
        interval: 10s
    ingestor_client:
      endpoint: inproc://
  ingester:
    enabled: true