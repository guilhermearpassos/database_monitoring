services:
  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    depends_on:
      - sqlsights
  #    environment:
  #      - GF_SECURITY_ADMIN_USER=admin
  #      - GF_SECURITY_ADMIN_PASSWORD=password

  #    extra_hosts:
  #      - "host.docker.internal:host-gateway"

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    environment:
      SA_PASSWORD: "SqlServer2019!"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"

  load_gen:
    #    container_name: sqlsights-grpc
    image: guilhermearpassos/sql-sight:v1.0.28
    build: .

    command:
      - "load_gen"
      - "--config=/cfg/agent.toml"
    volumes:
      - "./local/docker:/cfg"
    depends_on:
      - sqlserver

  sqlsights:
    container_name: sqlsights
    image: guilhermearpassos/sql-sight:v2.0.0-b22
    command:
      - "all"
      - "--config=/v2.yaml"
    volumes:
      - "./local/docker/v2.yaml:/v2.yaml"
    ports:
      - "9014:9014"
      - "9015:9015"
      - "9016:9016"
    depends_on:
      - postgres
      - sqlserver

  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    restart: always

    environment:
      POSTGRES_PASSWORD: example

  jaeger-all-in-one:
    image: jaegertracing/all-in-one:latest
    restart: always
    ports:
      - "16686:16686"
      - "14268"
      - "14250"

  # Zipkin
  zipkin-all-in-one:
    image: openzipkin/zipkin:latest
    environment:
      - JAVA_OPTS=-Xms1024m -Xmx1024m -XX:+ExitOnOutOfMemoryError
    restart: always
    ports:
      - "9411:9411"

  # Collector
  otel-collector:
    image: otel/opentelemetry-collector:0.121.0
    restart: always
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "1888:1888"   # pprof extension
      - "8888:8888"   # Prometheus metrics exposed by the collector
      - "8889:8889"   # Prometheus exporter metrics
      - "13133:13133" # health_check extension
      - "4317:4317"   # OTLP gRPC receiver
      - "55679:55679" # zpages extension
    depends_on:
      - jaeger-all-in-one
      - zipkin-all-in-one
